<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HERMES2 Recorder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      width: 300px;
      min-height: 200px;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2d2d4e;
    }

    .header .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #555;
      transition: background 0.3s;
    }
    .header .dot.active { background: #e74c3c; animation: pulse 1.2s infinite; }
    .header .dot.stopped { background: #27ae60; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .status-row {
      background: #16213e;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    .status-row .label { color: #7f8c8d; margin-right: 6px; }
    .status-row .value { color: #ecf0f1; font-weight: 500; }
    .status-row .value.red { color: #e74c3c; }
    .status-row .value.green { color: #27ae60; }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: #16213e;
      border-radius: 8px;
      padding: 8px 12px;
      text-align: center;
    }
    .stat-card .num {
      font-size: 22px;
      font-weight: 700;
      color: #3498db;
    }
    .stat-card .lbl {
      font-size: 10px;
      color: #7f8c8d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-row {
      margin-bottom: 12px;
    }
    .input-row input {
      width: 100%;
      background: #16213e;
      border: 1px solid #2d2d4e;
      border-radius: 6px;
      padding: 8px 10px;
      color: #ecf0f1;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-row input:focus { border-color: #3498db; }
    .input-row input::placeholder { color: #555; }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
      margin-bottom: 8px;
    }
    .btn:last-child { margin-bottom: 0; }
    .btn:active { transform: scale(0.97); }

    .btn-start {
      background: #e74c3c;
      color: #fff;
    }
    .btn-start:hover { background: #c0392b; }
    .btn-start:disabled { background: #555; cursor: not-allowed; }

    .btn-stop {
      background: #27ae60;
      color: #fff;
    }
    .btn-stop:hover { background: #1e8449; }
    .btn-stop:disabled { background: #555; cursor: not-allowed; }

    .btn-export {
      background: #2d2d4e;
      color: #bdc3c7;
      font-size: 12px;
    }
    .btn-export:hover { background: #3d3d6e; }
    .btn-export:disabled { background: #222; cursor: not-allowed; }

    .msg {
      font-size: 11px;
      color: #7f8c8d;
      text-align: center;
      margin-top: 8px;
    }
    .msg.ok { color: #27ae60; }
    .msg.err { color: #e74c3c; }

    .divider {
      border: none;
      border-top: 1px solid #2d2d4e;
      margin: 12px 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="dot" id="statusDot"></div>
    <h1>HERMES2 Recorder</h1>
  </div>

  <div class="status-row">
    <span class="label">Estado:</span>
    <span class="value" id="statusText">Cargando...</span>
  </div>

  <div class="status-row">
    <span class="label">Flujo:</span>
    <span class="value" id="flujoText">—</span>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="num" id="accionesCount">0</div>
      <div class="lbl">Acciones</div>
    </div>
    <div class="stat-card">
      <div class="num" id="elementosCount">0</div>
      <div class="lbl">Elementos</div>
    </div>
  </div>

  <hr class="divider">

  <div class="input-row" id="inputRow">
    <input type="text" id="flujoInput" placeholder='Nombre del flujo (ej: login)' maxlength="50">
  </div>

  <button class="btn btn-start" id="btnStart">🔴 Iniciar Grabación</button>
  <button class="btn btn-stop" id="btnStop" disabled>⏹️ Detener y Exportar</button>
  <button class="btn btn-export" id="btnExport" disabled>📋 Ver JSON en Consola</button>

  <div class="msg" id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
