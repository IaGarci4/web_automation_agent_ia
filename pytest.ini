[pytest]
asyncio_mode = auto
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
testpaths = src

markers =
    smoke:         Flujos básicos de humo
    flujo:         Flujos automatizados generados
    money_transfer: Envíos de dinero (módulo de pagadores) — casos aleatorios
    analisis:      Reconocimiento/descubrimiento de catálogos (analizer)
    etiqueta:      Etiquetas de deploy (validaciones que liberan a producción)
    sanity_general: Flujos grabados de sanidad (parametrizados por idioma)

filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
