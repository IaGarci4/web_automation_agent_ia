[pytest]
asyncio_mode = auto
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
testpaths = src

markers =
    smoke:         Flujos básicos de humo
    flujo:         Flujos automatizados generados
    money_transfer: Envíos de dinero (módulo de pagadores) — casos aleatorios
    analisis:      Reconocimiento/descubrimiento de catálogos (analizer)
    etiqueta:      Etiquetas de deploy (validaciones que liberan a producción)
    hardware_agent: Flujos que invocan al Hardware Agent local (KRA-1527) — requieren PW_HEADLESS=0
    sanity_general: Flujos grabados de sanidad (parametrizados por idioma)
    chronos:       Casos que además usan Chronos (back office)
    deploy:        Casos de un deploy puntual (src/tests/deploy/<carpeta>)
    api_lunex:     Casos que llaman a la API Lunex (TRN-239) — sin navegador
    caso_trn239:   Identidad del caso en TRN-239: (CP0X-Nombre, título)
    idor:          Casos de autorización IDOR IdUser/IdAgent MONO-agente (KRA-1526)
    idor_multi:    Casos de autorización IDOR MULTI-agente (KRA-1526, agencia 0040, KRA1526_MULTI=1)
    caso_kra1526:  Identidad del caso en KRA-1526: (CP0X-Nombre, título)
    cosecha:       Herramienta: cosecha direcciones reales desde el validador (KRA1527_COSECHA=1)
    valida_dir:    Prueba en bucle del validador de direcciones (KRA1527_VALIDA_DIR=1)
    repro_dir:     Reproduce/valida el banco de direcciones guardado (KRA1527_REPRO_DIR=1)
    audit_dir:     Auditoría DevTools del validador de direcciones — vuelca DOM+red (KRA1527_AUDIT=1)
    agent_cdp:     Smoke del enganche CDP al WebView2 del Hermes2Agent (HERMES_AGENT_CDP=1)
    soporte_remoto: Consulta el token en BD y lo aplica en el agente (Soporte Remoto)
    agente_dejar:  Arma un envío de dinero en el agente y lo deja SIN enviar (hasta producción)

filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
